name: Build RPM (ALT)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      alt_image:
        description: "ALT container image"
        required: false
        default: "registry.altlinux.org/alt/alt:sisyphus"

env:
  ALT_IMAGE: ${{ github.event.inputs.alt_image || 'registry.altlinux.org/alt/alt:sisyphus' }}

jobs:
  rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show ALT image
        run: echo "Using container $ALT_IMAGE"

      - name: Fetch sources
        run: |
          set -eux
          ver="$(grep -m1 '^Version:' fontmaster.spec | awk '{print $2}')"
          mkdir -p rpmbuild/SOURCES rpmbuild/SPECS
          # rpmbuild looks for the basename of Source0, i.e. <version>.tar.gz
          curl -fL --retry 3 -o "rpmbuild/SOURCES/${ver}.tar.gz" \
            "https://github.com/NICourced/fontmaster/archive/refs/tags/${ver}.tar.gz"
          cp fontmaster.spec rpmbuild/SPECS/
          ls -l rpmbuild/SOURCES

      - name: Fetch upstream AppImage and portable archive
        run: |
          set -eux
          ver="$(grep -m1 '^Version:' fontmaster.spec | awk '{print $2}')"
          base="https://github.com/NICourced/fontmaster/releases/download/${ver}"
          mkdir -p dist
          if curl -fL --retry 3 -o "dist/FontMaster-${ver}-linux-x86_64.AppImage" \
                 "${base}/FontMaster-${ver}-linux-x86_64.AppImage"; then
            curl -fL --retry 3 -o "dist/FontMaster-${ver}-linux-x86_64.tar.gz" \
                 "${base}/FontMaster-${ver}-linux-x86_64.tar.gz"
            curl -fL --retry 3 -o "dist/SHA256SUMS" "${base}/SHA256SUMS"
            (cd dist && sha256sum --check SHA256SUMS)
          else
            echo "No upstream AppImage published for ${ver}; skipping" >&2
            rm -f "dist/FontMaster-${ver}-linux-x86_64.AppImage"
          fi

      - name: Build RPM and SRPM
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$ALT_IMAGE" \
            bash /work/ci/build-in-container.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontmaster-packages
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/*.rpm
            rpmbuild/BUILD/*.log
            dist/*
          if-no-files-found: warn
